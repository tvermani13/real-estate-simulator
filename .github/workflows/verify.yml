name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --requirement backend/requirements.lock
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - run: python -m pip check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  container-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml --profile jobs config --quiet
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml build backend frontend
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml up -d --wait --wait-timeout 120
      - run: python3 scripts/smoke_stack.py --authenticated
      - if: always()
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml down --volumes
